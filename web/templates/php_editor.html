<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP 模块配置 - TVGate Web管理</title>
    <link rel="stylesheet" href="{{.webPath}}static/common.css">
    <link rel="stylesheet" href="{{.webPath}}static/mobile.css">
    <link rel="stylesheet" href="{{.webPath}}static/version.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--win11-bg);
            color: var(--win11-text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--win11-surface);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--win11-shadow);
            border: 1px solid var(--win11-border);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            color: var(--win11-text-primary);
            text-align: center;
            font-weight: 600;
        }

        .auth-section {
            text-align: right;
            margin-bottom: 20px;
        }

        .auth-section a {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--win11-success);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        .auth-section a.logout {
            background-color: var(--win11-danger);
        }

        .auth-section a:hover {
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--win11-text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--win11-card);
            border: 1px solid var(--win11-border);
            border-radius: 4px;
            color: var(--win11-text-primary);
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--win11-accent);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--win11-accent);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: var(--win11-accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            background-color: var(--win11-accent-active);
            transform: translateY(0);
        }

        .btn-success {
            background-color: var(--win11-success);
        }

        .btn-success:hover {
            background-color: #57a357;
        }

        .btn-warning {
            background-color: var(--win11-warning);
            color: #000000;
        }

        .btn-warning:hover {
            background-color: #e6b800;
        }

        .form-buttons {
            text-align: center;
            margin: 20px 0;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            transition: all 0.3s;
            animation: fadeIn 0.3s;
        }

        .alert-success {
            background-color: rgba(102, 194, 102, 0.2);
            color: var(--win11-success);
            border: 1px solid var(--win11-success);
        }

        .alert-danger {
            background-color: rgba(232, 17, 35, 0.2);
            color: var(--win11-danger);
            border: 1px solid var(--win11-danger);
        }

        .hidden {
            display: none;
        }

        .section {
            background-color: var(--win11-card);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid var(--win11-border);
            transition: background-color 0.3s, transform 0.3s;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--win11-shadow);
        }

        .section-title {
            color: var(--win11-text-primary);
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--win11-border);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .index-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .index-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--win11-accent);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .index-tag .remove-tag {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
        }

        .index-tag .remove-tag:hover {
            opacity: 1;
        }

        .index-input {
            display: flex;
            gap: 8px;
        }

        .index-input input {
            flex: 1;
        }

        .hint {
            font-size: 12px;
            color: var(--win11-text-secondary);
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
    <script src="{{.webPath}}static/js/theme.js"></script>
</head>

<body>
    <div class="container">
        <div class="auth-section">
            <a href="{{.webPath}}code" class="btn">代码编辑</a>
            <a href="{{.webPath}}backup" class="btn">备份中心</a>
            <a href="{{.webPath}}logout" class="logout">退出</a>
        </div>

        <h1>PHP 模块配置</h1>

        <div id="alert-container" class="hidden"></div>

        <div class="form-buttons">
            <button class="btn btn-success" onclick="saveConfig()">保存配置</button>
            <button class="btn btn-warning" onclick="reloadConfig()">重新加载</button>
            <a href="{{.webPath}}" class="btn">返回首页</a>
        </div>

        <form id="phpForm">
            <div class="section">
                <h2 class="section-title">基本配置</h2>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="enabled">
                        <label for="enabled">启用 PHP 模块</label>
                    </div>
                    <div class="hint">关闭后 /php/ 路径将不再可用</div>
                </div>

                <div class="form-group">
                    <label for="path">访问路径前缀</label>
                    <input type="text" id="path" class="form-control" placeholder="/php/">
                    <div class="hint">对外访问 URL 前缀，如 /php/</div>
                </div>

                <div class="form-group">
                    <label for="docroot">脚本根目录 (docroot)</label>
                    <input type="text" id="docroot" class="form-control" placeholder="www">
                    <div class="hint">PHP 脚本从磁盘读取的根目录，默认相对路径 www（相对配置文件目录），也支持绝对路径如 /www</div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">目录索引</h2>
                <div class="form-group">
                    <label>索引文件列表</label>
                    <div class="index-list" id="index-list"></div>
                    <div class="index-input">
                        <input type="text" id="index-input" class="form-control" placeholder="输入文件名如 index.php">
                        <button type="button" class="btn" onclick="addIndex()">添加</button>
                    </div>
                    <div class="hint">访问目录时按顺序尝试这些文件</div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">Worker 模式</h2>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="worker_mode">
                        <label for="worker_mode">启用 Worker 常驻模式</label>
                    </div>
                    <div class="hint">复用解释器实例，降低冷启动开销</div>
                </div>

                <div class="form-group">
                    <label for="workers">Worker 进程数</label>
                    <input type="number" id="workers" class="form-control" min="0" max="64" placeholder="4">
                    <div class="hint">Worker 模式为 true 时生效</div>
                </div>
            </div>
        </form>

        <div class="form-buttons">
            <button class="btn btn-success" onclick="saveConfig()">保存配置</button>
            <button class="btn btn-warning" onclick="reloadConfig()">重新加载</button>
            <a href="{{.webPath}}" class="btn">返回首页</a>
        </div>

        <script>
            const webPath = '{{.webPath}}';
            window.webPath = webPath;

            let indexList = [];

            function showAlert(message, type) {
                const alertContainer = document.getElementById('alert-container');
                alertContainer.className = 'alert alert-' + type;
                alertContainer.textContent = message;
                alertContainer.classList.remove('hidden');
                setTimeout(() => { alertContainer.classList.add('hidden'); }, 5000);
            }

            function renderIndexList() {
                const container = document.getElementById('index-list');
                container.innerHTML = '';
                indexList.forEach((item, i) => {
                    const tag = document.createElement('span');
                    tag.className = 'index-tag';
                    tag.innerHTML = item + ' <span class="remove-tag" onclick="removeIndex(' + i + ')">&times;</span>';
                    container.appendChild(tag);
                });
            }

            function addIndex() {
                const input = document.getElementById('index-input');
                const val = input.value.trim();
                if (val && !indexList.includes(val)) {
                    indexList.push(val);
                    renderIndexList();
                    input.value = '';
                }
            }

            function removeIndex(i) {
                indexList.splice(i, 1);
                renderIndexList();
            }

            async function loadConfig() {
                try {
                    const resp = await fetch(webPath + 'config/php');
                    if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
                    const data = await resp.json();

                    document.getElementById('enabled').checked = data.enabled || false;
                    document.getElementById('path').value = data.path || '/php/';
                    document.getElementById('docroot').value = data.docroot || 'www';
                    document.getElementById('worker_mode').checked = data.worker_mode || false;
                    document.getElementById('workers').value = data.workers || 4;

                    indexList = data.index || ['index.php', 'index.html'];
                    renderIndexList();
                } catch (error) {
                    console.error('加载配置失败:', error);
                    showAlert('加载配置失败: ' + error.message, 'danger');
                }
            }

            async function saveConfig() {
                const cfg = {
                    enabled: document.getElementById('enabled').checked,
                    path: document.getElementById('path').value.trim(),
                    docroot: document.getElementById('docroot').value.trim(),
                    index: indexList,
                    worker_mode: document.getElementById('worker_mode').checked,
                    workers: parseInt(document.getElementById('workers').value, 10) || 0
                };

                if (!cfg.path) {
                    showAlert('请填写访问路径前缀', 'danger');
                    return;
                }
                if (!cfg.docroot) {
                    showAlert('请填写脚本根目录', 'danger');
                    return;
                }

                try {
                    const resp = await fetch(webPath + 'config/save-php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(cfg)
                    });
                    if (resp.ok) {
                        showAlert('配置保存成功，热加载将自动刷新', 'success');
                    } else {
                        const text = await resp.text();
                        throw new Error(text || '保存失败');
                    }
                } catch (error) {
                    console.error('保存配置失败:', error);
                    showAlert('保存配置失败: ' + error.message, 'danger');
                }
            }

            async function reloadConfig() {
                await loadConfig();
                showAlert('配置已重新加载', 'success');
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadConfig();
            });
        </script>
    </div>
</body>

</html>
