<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码文件管理 - TVGate</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f4f6f8; color: #222; }
  header { background: #1f2937; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header a.back { font-size: 12px; color: #c7d2fe; text-decoration: none; border: 1px solid #4f46e5; padding: 4px 10px; border-radius: 5px; }
  header a.back:hover { background: #4f46e5; color: #fff; }
  .hint { font-size: 12px; opacity: .65; }
  .container { display: flex; height: calc(100vh - 46px); }
  .sidebar { width: 290px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
  .sidebar .tools { padding: 10px; border-bottom: 1px solid #e5e7eb; display: flex; flex-wrap: wrap; gap: 6px; }
  .sidebar .tools button, .sidebar .tools label.btn { font-size: 12px; padding: 5px 9px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 5px; cursor: pointer; }
  .sidebar .tools button:hover { background: #eef2ff; }
  .filelist { flex: 1; overflow-y: auto; padding: 6px; }
  .filelist .item { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filelist .item:hover { background: #eef2ff; }
  .filelist .item.dir { color: #6366f1; font-weight: 600; }
  .filelist .item.active { background: #c7d2fe; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor-bar { padding: 8px 12px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .editor-bar .path { font-size: 13px; color: #374151; font-family: monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-bar button { font-size: 13px; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; background: #4f46e5; color: #fff; }
  .editor-bar button.sec { background: #6b7280; }
  .editor-bar button.danger { background: #dc2626; }
  .editor-bar button:hover { opacity: .9; }
  .editor-wrap { flex: 1; display: flex; overflow: hidden; background: #fff; }
  .gutter { padding: 14px 8px 14px 12px; text-align: right; color: #9ca3af; background: #fafafa; border-right: 1px solid #eee; font-family: Consolas, Menlo, monospace; font-size: 13px; line-height: 1.5; overflow: hidden; user-select: none; min-width: 44px; }
  textarea#editor { flex: 1; width: 100%; border: none; padding: 14px; font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; resize: none; outline: none; background: #fff; white-space: pre; overflow: auto; }
  #status { padding: 8px 14px; font-size: 13px; background: #fff; border-top: 1px solid #e5e7eb; min-height: 26px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  #status .err { color: #dc2626; }
  #status .warn { color: #d97706; }
  #status .ok { color: #16a34a; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; padding: 20px; border-radius: 8px; width: 340px; }
  .modal .box input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 5px; }
  .modal .box .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .modal .box button { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; background: #4f46e5; color: #fff; }
  .modal .box button.cancel { background: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1>代码文件管理</h1>
  <a class="back" href="{{.webPath}}">← 返回管理后台</a>
  <span class="hint">目录：docroot（PHP 脚本目录）· Ctrl+S 保存 · Ctrl+Enter 语法检测</span>
</header>
<div class="container">
  <div class="sidebar">
    <div class="tools">
      <button id="btnNewFile">新建文件</button>
      <button id="btnNewDir">新建目录</button>
      <label class="btn">上传<input id="fileUpload" type="file" multiple style="display:none"></label>
      <button id="btnRefresh">刷新</button>
    </div>
    <div class="filelist" id="filelist"></div>
  </div>
  <div class="main">
    <div class="editor-bar">
      <span class="path" id="curPath">未选择文件</span>
      <button id="btnSave">保存</button>
      <button class="sec" id="btnCheck">语法检测</button>
      <button class="sec" id="btnDownload">下载</button>
      <button class="danger" id="btnDelete">删除</button>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="editor" placeholder="选择左侧文件进行编辑，或新建文件后在此输入代码…" spellcheck="false"></textarea>
    </div>
    <div id="status"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div id="modalTitle">新建</div>
    <input id="modalInput" placeholder="相对路径，例如 test.php 或 sub/dir.php">
    <div class="row">
      <button class="cancel" id="modalCancel">取消</button>
      <button id="modalOk">确定</button>
    </div>
  </div>
</div>

<script>
const webPath = "{{.webPath}}";
let currentPath = "";
const editor = document.getElementById("editor");
const gutter = document.getElementById("gutter");

function setStatus(html, cls) {
  const s = document.getElementById("status");
  s.innerHTML = cls ? `<span class="${cls}">${html}</span>` : html;
}
function api(path, opts) {
  return fetch(webPath + path, opts).then(r => r.json()).catch(e => ({status:"error", message: e.message}));
}
function updateGutter() {
  const lines = editor.value.split("\n").length || 1;
  let g = "";
  for (let i = 1; i <= lines; i++) g += i + "\n";
  gutter.textContent = g;
}
editor.addEventListener("input", updateGutter);
editor.addEventListener("scroll", () => { gutter.scrollTop = editor.scrollTop; });
editor.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); const s=editor.selectionStart,en=editor.selectionEnd; editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en); editor.selectionStart=editor.selectionEnd=s+2; updateGutter(); }
  if ((e.ctrlKey||e.metaKey) && e.key === "s") { e.preventDefault(); saveFile(); }
  if ((e.ctrlKey||e.metaKey) && e.key === "Enter") { e.preventDefault(); checkSyntax(); }
});

async function loadList() {
  const res = await api("api/code/list");
  const list = document.getElementById("filelist");
  list.innerHTML = "";
  if (res.status !== "success") { setStatus("加载失败：" + (res.message||""), "err"); return; }
  const items = (res.items||[]).slice().sort((a,b) => (a.isDir===b.isDir) ? (a.path>b.path?1:-1) : (a.isDir?-1:1));
  for (const it of items) {
    const div = document.createElement("div");
    div.className = "item" + (it.isDir ? " dir" : "");
    div.textContent = (it.isDir ? "📁 " : "📄 ") + it.path;
    div.title = it.path + "  (" + (it.size||0) + " B)";
    if (!it.isDir) div.onclick = () => openFile(it.path);
    if (it.path === currentPath) div.classList.add("active");
    list.appendChild(div);
  }
}

async function openFile(path) {
  const r = await fetch(webPath + "api/code/read?path=" + encodeURIComponent(path));
  if (r.ok) {
    const res = await r.json();
    if (res.status === "success") {
      currentPath = path;
      editor.value = res.content;
      document.getElementById("curPath").textContent = path;
      updateGutter();
      setStatus("已加载：" + path);
      loadList();
    } else {
      setStatus("读取失败：" + (res.message || ""), "err");
    }
  } else {
    const res = await r.json().catch(()=>({}));
    setStatus("读取失败：" + (res.message || r.statusText), "err");
  }
}

async function saveFile() {
  if (!currentPath) { setStatus("请先选择或新建文件", "warn"); return; }
  const content = editor.value;
  const res = await api("api/code/save?path=" + encodeURIComponent(currentPath), { method: "POST", body: content });
  setStatus(res.status === "success" ? "已保存：" + currentPath : ("保存失败：" + (res.message||"")), res.status==="success"?"ok":"err");
  if (res.status === "success") loadList();
}

async function checkSyntax() {
  let res;
  if (currentPath) {
    res = await api("api/code/check?path=" + encodeURIComponent(currentPath), {method:"POST", body:""});
  } else {
    const content = editor.value;
    res = await api("api/code/check", {method:"POST", body: content});
  }
  if (res.status !== "success") { setStatus("检测失败：" + (res.message||""), "err"); return; }
  if (res.ok) { setStatus("✓ 语法检测通过，未发现明显错误", "ok"); return; }
  const lines = (res.issues||[]).map(i => `[${i.level}] 行${i.line}: ${i.message}`).join("\n");
  setStatus(lines, res.issues.some(i=>i.level==="error") ? "err" : "warn");
}

async function downloadFile() {
  if (!currentPath) { setStatus("请先选择文件", "warn"); return; }
  window.location.href = webPath + "api/code/download?path=" + encodeURIComponent(currentPath);
}

async function deleteFile() {
  if (!currentPath) { setStatus("请先选择文件", "warn"); return; }
  if (!confirm("确定删除 " + currentPath + " ？")) return;
  const res = await api("api/code/delete?path=" + encodeURIComponent(currentPath), {method:"POST"});
  if (res.status === "success") {
    currentPath = ""; editor.value = ""; updateGutter();
    document.getElementById("curPath").textContent = "未选择文件";
    setStatus("已删除"); loadList();
  } else setStatus("删除失败：" + (res.message||""), "err");
}

const modal = document.getElementById("modal");
let modalMode = "file";
function openModal(mode) {
  modalMode = mode;
  document.getElementById("modalTitle").textContent = mode === "dir" ? "新建目录（相对路径）" : "新建文件（相对路径）";
  document.getElementById("modalInput").value = "";
  modal.classList.add("show");
  document.getElementById("modalInput").focus();
}
document.getElementById("modalCancel").onclick = () => modal.classList.remove("show");
document.getElementById("modalOk").onclick = async () => {
  const p = document.getElementById("modalInput").value.trim();
  if (!p) return;
  const res = await api("api/code/new?path=" + encodeURIComponent(p) + "&type=" + (modalMode==="dir"?"dir":"file"), {method:"POST"});
  modal.classList.remove("show");
  if (res.status === "success") {
    if (modalMode !== "dir") { currentPath = p; document.getElementById("curPath").textContent = p; }
    setStatus("已创建：" + p); loadList();
  } else setStatus("创建失败：" + (res.message||""), "err");
};

document.getElementById("btnNewFile").onclick = () => openModal("file");
document.getElementById("btnNewDir").onclick = () => openModal("dir");
document.getElementById("btnRefresh").onclick = loadList;
document.getElementById("btnSave").onclick = saveFile;
document.getElementById("btnCheck").onclick = checkSyntax;
document.getElementById("btnDownload").onclick = downloadFile;
document.getElementById("btnDelete").onclick = deleteFile;
document.getElementById("fileUpload").onchange = async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("file", f);
  const res = await fetch(webPath + "api/code/upload", {method:"POST", body: fd}).then(r=>r.json());
  setStatus(res.status === "success" ? "上传完成" : ("上传失败：" + (res.message||"")), res.status==="success"?"ok":"err");
  if (res.status === "success") loadList();
  e.target.value = "";
};

updateGutter();
setStatus("就绪。选择左侧文件进行编辑，或点击「新建文件」。");
loadList();
</script>
</body>
</html>
