<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库同步配置编辑器 - TVGate Web管理</title>
    <link rel="stylesheet" href="{{.webPath}}static/common.css">
    <link rel="stylesheet" href="{{.webPath}}static/mobile.css">
    <link rel="stylesheet" href="{{.webPath}}static/version.css">
    <script src="{{.webPath}}static/js/theme.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--win11-bg);
            color: var(--win11-text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--win11-surface);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--win11-shadow);
            border: 1px solid var(--win11-border);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            color: var(--win11-text-primary);
            text-align: center;
            font-weight: 600;
        }

        .auth-section {
            text-align: right;
            margin-bottom: 20px;
        }

        .auth-section a {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--win11-success);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        .auth-section a.logout {
            background-color: var(--win11-danger);
        }

        .auth-section a:hover {
            opacity: 0.9;
        }

        .entry {
            border: 1px solid var(--win11-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            background-color: var(--win11-card);
        }

        .entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .entry-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--win11-text-primary);
        }

        .entry-header .entry-actions {
            display: flex;
            gap: 10px;
        }

        .remove-entry {
            background-color: var(--win11-danger);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 8px 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--win11-text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background-color: var(--win11-surface);
            border: 1px solid var(--win11-border);
            border-radius: 4px;
            color: var(--win11-text-primary);
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--win11-accent);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.4);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--win11-accent);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--win11-accent-hover);
        }

        .btn:disabled {
            background-color: var(--win11-disabled);
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--win11-secondary);
        }

        .btn-secondary:hover {
            background-color: var(--win11-secondary-hover);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 0;
        }

        .form-row .form-col {
            flex: 1;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        .list-container {
            margin-top: 10px;
        }

        .branch-row {
            display: flex;
            align-items: stretch;
            gap: 6px;
        }

        .branch-row .form-control {
            flex: 1;
        }

        .branch-refresh {
            width: 44px;
            flex-shrink: 0;
            border: 1px solid var(--win11-border);
            background-color: var(--win11-surface);
            color: var(--win11-text-primary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .branch-refresh:hover {
            border-color: var(--win11-accent);
        }

        .list-item {
            display: flex;
            margin-bottom: 10px;
        }

        .list-item input {
            flex: 1;
            margin-right: 10px;
        }

        .list-item button {
            background-color: var(--win11-danger);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0 10px;
        }

        .add-item {
            background-color: var(--win11-success);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 8px 12px;
            margin-top: 5px;
        }

        .add-entry {
            background-color: var(--win11-success);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 12px 20px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 13px;
            color: var(--win11-text-secondary);
            margin-top: 6px;
            line-height: 1.6;
        }

        .notification {
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            display: none;
        }

        .notification.success {
            background-color: var(--win11-success);
            color: white;
            display: block;
        }

        .notification.error {
            background-color: var(--win11-danger);
            color: white;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>仓库同步配置编辑器</h1>

        <div class="auth-section">
            <a href="{{.webPath}}" class="btn btn-secondary">返回主界面</a>
            <a href="{{.webPath}}logout" class="btn logout">退出登录</a>
        </div>

        <div id="notification" class="notification"></div>

        <button type="button" class="add-entry" id="addEntryBtn">+ 添加仓库</button>

        <div id="entryContainer">
            <!-- 仓库条目将通过 JavaScript 动态渲染 -->
        </div>

        <div class="form-group">
            <button type="button" class="btn" id="saveBtn">保存全部配置</button>
            <button type="button" class="btn btn-secondary" id="resetBtn">重置</button>
        </div>
    </div>

    <script>
        const webPath = "{{.webPath}}";
        window.webPath = webPath;
        let entries = [];
        let entrySeq = 0;

        document.addEventListener('DOMContentLoaded', function () {
            loadConfig();
            setupEventListeners();
            syncTheme();
        });

        function setupEventListeners() {
            document.getElementById('saveBtn').addEventListener('click', saveConfig);
            document.getElementById('resetBtn').addEventListener('click', loadConfig);
            document.getElementById('addEntryBtn').addEventListener('click', () => {
                entries.push(newEntry());
                renderEntries();
            });
        }

        function newEntry() {
            return {
                name: '',
                enabled: false,
                type: 'github',
                host: '',
                repo: '',
                branch: 'main',
                token: '',
                interval: '60s',
                timeout: '15s',
                repo_path: '.',
                local_path: 'tvbox',
                only_php: false,
                backup: true,
                delete: false,
                protect: []
            };
        }

        function loadConfig() {
            fetch('{{.webPath}}api/sync/config')
                .then(response => response.json())
                .then(data => {
                    entries = Array.isArray(data) && data.length ? data : [newEntry()];
                    renderEntries();
                    // 加载后为已有仓库自动拉取分支
                    entries.forEach((e, i) => { if (e && e.repo) fetchBranches(i); });
                })
                .catch(error => {
                    entries = [newEntry()];
                    renderEntries();
                    showNotification('加载配置失败: ' + error.message, 'error');
                });
        }

        function entryHtml(entry, idx) {
            const protectRows = (entry.protect || []).map((p, pi) => `
                <div class="list-item">
                    <input type="text" class="form-control protect-input" value="${p}" data-e="${idx}" data-p="${pi}">
                    <button type="button" class="remove-protect" data-e="${idx}" data-p="${pi}">删除</button>
                </div>`).join('');

            return `
            <div class="entry" data-e="${idx}">
                <div class="entry-header">
                    <h2>仓库 ${idx + 1}：${entry.name || entry.repo || '(未命名)'}</h2>
                    <div class="entry-actions">
                        <button type="button" class="remove-entry" data-e="${idx}">删除该仓库</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>名称（可选标识）</label>
                            <input type="text" class="form-control name-input" value="${entry.name || ''}" placeholder="例如: tvbox" data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group checkbox-group">
                            <label>启用</label>
                            <input type="checkbox" class="enabled-input" ${entry.enabled ? 'checked' : ''} data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>仓库类型</label>
                            <select class="form-control type-input" data-e="${idx}">
                                <option value="github" ${entry.type === 'github' ? 'selected' : ''}>GitHub</option>
                                <option value="gitlab" ${entry.type === 'gitlab' ? 'selected' : ''}>GitLab</option>
                                <option value="gitee" ${entry.type === 'gitee' ? 'selected' : ''}>Gitee</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>仓库标识（owner/repo）</label>
                            <input type="text" class="form-control repo-input" value="${entry.repo || ''}" placeholder="例如: qist/tvbox" data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>同步分支</label>
                            <div class="branch-row">
                                <select class="form-control branch-select" data-e="${idx}" title="从仓库自动拉取，可点右侧刷新">
                                    <option value="${entry.branch || 'main'}">${entry.branch || 'main'}</option>
                                </select>
                                <button type="button" class="branch-refresh" data-e="${idx}" title="刷新分支列表">↻</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>自建实例地址（host，可选）</label>
                    <input type="text" class="form-control host-input" value="${entry.host || ''}" placeholder="自建 GitLab: https://git.内网 或 Gitee: https://gitee.com（留空 = 平台默认）" data-e="${idx}">
                </div>

                <div class="form-group">
                    <label>访问令牌（PAT，公开仓库可留空）</label>
                    <input type="text" class="form-control token-input" value="${entry.token || ''}" placeholder="已保存的令牌以 ******** 显示，不回显；填写新值保存后即生效" data-e="${idx}">
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>轮询间隔</label>
                            <input type="text" class="form-control interval-input" value="${entry.interval || '60s'}" placeholder="例如: 60s（最小 10s）" data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>请求超时</label>
                            <input type="text" class="form-control timeout-input" value="${entry.timeout || '15s'}" placeholder="例如: 15s" data-e="${idx}">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>仓库内源目录（repo_path）</label>
                            <input type="text" class="form-control repo-path-input" value="${entry.repo_path || '.'}" placeholder="例如: .（仓库根）" data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>本地目标（local_path）</label>
                            <input type="text" class="form-control local-path-input" value="${entry.local_path || 'tvbox'}" placeholder="例如: tvbox（docroot/tvbox）" data-e="${idx}">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group checkbox-group">
                            <label>仅同步 PHP 文件</label>
                            <input type="checkbox" class="only-php-input" ${entry.only_php ? 'checked' : ''} data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group checkbox-group">
                            <label>覆盖/删除前备份</label>
                            <input type="checkbox" class="backup-input" ${entry.backup !== false ? 'checked' : ''} data-e="${idx}">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group checkbox-group">
                            <label>远端删除时本地也删除</label>
                            <input type="checkbox" class="delete-input" ${entry.delete ? 'checked' : ''} data-e="${idx}">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>本地保护清单（protect，永不覆盖/删除）</label>
                    <div class="list-container protect-container" data-e="${idx}">${protectRows}</div>
                    <button type="button" class="add-item add-protect" data-e="${idx}">添加保护路径</button>
                    <div class="hint">相对 local_path 的路径列表，支持目录前缀。设备私有文件（如 <code>tv.txt</code>）或整个目录（<code>private/</code>）加入后同步永不覆盖、永不删除。</div>
                </div>
            </div>`;
        }

        function renderEntries() {
            const container = document.getElementById('entryContainer');
            container.innerHTML = entries.map(entryHtml).join('');

            // 条目级事件
            document.querySelectorAll('.remove-entry').forEach(btn => {
                btn.addEventListener('click', function () {
                    entries.splice(parseInt(this.getAttribute('data-e')), 1);
                    renderEntries();
                });
            });
            // 字段输入事件
            bindTextInput('.name-input', 'name');
            bindTextInput('.repo-input', 'repo', scheduleBranchFetch);
            bindTextInput('.token-input', 'token', scheduleBranchFetch);
            bindTextInput('.interval-input', 'interval');
            bindTextInput('.timeout-input', 'timeout');
            bindTextInput('.repo-path-input', 'repo_path');
            bindTextInput('.local-path-input', 'local_path');
            bindSelectInput('.type-input', 'type', scheduleBranchFetch);
            bindTextInput('.host-input', 'host', scheduleBranchFetch);
            bindCheckInput('.enabled-input', 'enabled');
            bindCheckInput('.only-php-input', 'only_php');
            bindCheckInput('.backup-input', 'backup');
            bindCheckInput('.delete-input', 'delete');

            // 分支下拉：选择更新 entries；刷新按钮立即拉取
            document.querySelectorAll('.branch-select').forEach(sel => {
                sel.addEventListener('change', function () {
                    entries[parseInt(this.getAttribute('data-e'))].branch = this.value;
                });
            });
            document.querySelectorAll('.branch-refresh').forEach(btn => {
                btn.addEventListener('click', function () {
                    fetchBranches(parseInt(this.getAttribute('data-e')));
                });
            });

            // protect 添加
            document.querySelectorAll('.add-protect').forEach(btn => {
                btn.addEventListener('click', function () {
                    const idx = parseInt(this.getAttribute('data-e'));
                    if (!entries[idx].protect) entries[idx].protect = [];
                    entries[idx].protect.push('');
                    renderEntries();
                });
            });
            // protect 删除/编辑
            document.querySelectorAll('.remove-protect').forEach(btn => {
                btn.addEventListener('click', function () {
                    const idx = parseInt(this.getAttribute('data-e'));
                    const pi = parseInt(this.getAttribute('data-p'));
                    entries[idx].protect.splice(pi, 1);
                    renderEntries();
                });
            });
            document.querySelectorAll('.protect-input').forEach(input => {
                input.addEventListener('change', function () {
                    const idx = parseInt(this.getAttribute('data-e'));
                    const pi = parseInt(this.getAttribute('data-p'));
                    if (!entries[idx].protect) entries[idx].protect = [];
                    entries[idx].protect[pi] = this.value;
                });
            });
        }

        function bindTextInput(selector, field, after) {
            document.querySelectorAll(selector).forEach(input => {
                input.addEventListener('change', function () {
                    const idx = parseInt(this.getAttribute('data-e'));
                    entries[idx][field] = this.value;
                    updateEntryTitle(idx);
                    if (after) after(idx);
                });
            });
        }

        function bindSelectInput(selector, field, after) {
            document.querySelectorAll(selector).forEach(input => {
                input.addEventListener('change', function () {
                    const idx = parseInt(this.getAttribute('data-e'));
                    entries[idx][field] = this.value;
                    if (after) after(idx);
                });
            });
        }

        function bindCheckInput(selector, field) {
            document.querySelectorAll(selector).forEach(input => {
                input.addEventListener('change', function () {
                    entries[parseInt(this.getAttribute('data-e'))][field] = this.checked;
                });
            });
        }

        function updateEntryTitle(idx) {
            const header = document.querySelector(`.entry[data-e="${idx}"] .entry-header h2`);
            if (header) {
                const e = entries[idx];
                header.textContent = `仓库 ${idx + 1}：${e.name || e.repo || '(未命名)'}`;
            }
        }

        // 分支下拉：仓库/类型/host/token 变化后防抖自动拉取
        let branchFetchTimer = null;
        function scheduleBranchFetch(idx) {
            if (!entries[idx] || !entries[idx].repo) return;
            clearTimeout(branchFetchTimer);
            branchFetchTimer = setTimeout(() => fetchBranches(idx), 600);
        }

        function fetchBranches(idx) {
            const e = entries[idx];
            if (!e || !e.repo) return;
            const params = new URLSearchParams({
                type: e.type || 'github',
                host: e.host || '',
                repo: e.repo,
                token: e.token || ''
            });
            fetch(webPath + 'api/sync/branches?' + params.toString())
                .then(r => { if (!r.ok) throw new Error(''); return r.json(); })
                .then(branches => {
                    if (!Array.isArray(branches) || !branches.length) return;
                    const sel = document.querySelector(`.branch-select[data-e="${idx}"]`);
                    if (!sel) return;
                    const cur = entries[idx].branch || branches[0];
                    let html = branches.map(b => `<option value="${b}" ${b === cur ? 'selected' : ''}>${b}</option>`).join('');
                    if (!branches.includes(cur)) {
                        html += `<option value="${cur}" selected>${cur}</option>`;
                    }
                    sel.innerHTML = html;
                    entries[idx].branch = sel.value;
                })
                .catch(() => { /* 拉取失败保留手动值 */ });
        }

        function saveConfig() {
            // 收集并清理（空 repo 的条目不保存）
            const configData = entries
                .map(e => ({
                    name: (e.name || '').trim(),
                    enabled: !!e.enabled,
                    type: e.type || 'github',
                    host: (e.host || '').trim(),
                    repo: (e.repo || '').trim(),
                    branch: (e.branch || 'main').trim() || 'main',
                    token: e.token || '',
                    interval: (e.interval || '60s').trim() || '60s',
                    timeout: (e.timeout || '15s').trim() || '15s',
                    repo_path: (e.repo_path || '.').trim() || '.',
                    local_path: (e.local_path || 'tvbox').trim() || 'tvbox',
                    only_php: !!e.only_php,
                    backup: e.backup !== false,
                    delete: !!e.delete,
                    protect: (e.protect || []).filter(p => p.trim() !== '')
                }))
                .filter(e => e.repo !== '');

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = '保存中...';
            saveBtn.disabled = true;

            fetch('{{.webPath}}api/sync/config/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(configData)
            })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('保存失败');
                })
                .then(() => {
                    showNotification('配置保存成功，同步模块将自动重启', 'success');
                })
                .catch(error => {
                    showNotification('保存配置失败: ' + error.message, 'error');
                })
                .finally(() => {
                    saveBtn.textContent = originalText;
                    saveBtn.disabled = false;
                });
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            setTimeout(() => { notification.className = 'notification'; }, 4000);
        }

        function syncTheme() {
            fetch('{{.webPath}}sync-theme', { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    if (data.theme) document.documentElement.setAttribute('data-theme', data.theme);
                })
                .catch(() => { });
        }
    </script>
</body>

</html>
