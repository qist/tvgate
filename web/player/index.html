<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>电视直播</title>
  <style>
    :root {
      --bg: #0e1114;
      --panel: #161b20;
      --line: #232a31;
      --focus: #2b80ff;
      --text: #e6e8eb;
      --dim: #8f959e;
      --accent: #2b80ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 100vh;
    }

    /* 左：频道列表 */
    #side {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #head {
      padding: 14px 16px;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #head b {
      color: var(--accent);
    }

    #groups {
      overflow: auto;
      flex: 1;
      overflow-anchor: none;
      /* 关掉滚动锚定，避免展开/收起重绘时列表被拽回顶部 */
    }

    #groups .grp {
      padding: 11px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid transparent;
      user-select: none;
      font-weight: 600;
    }

    #groups .grp .caret {
      width: 14px;
      flex: none;
      color: var(--dim);
    }

    #groups .grp .gn {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #groups .grp .gc {
      color: var(--dim);
      font-size: 12px;
    }

    #groups .grp.focus {
      background: #1d242c;
      border-left-color: var(--focus);
      outline: none;
    }

    #groups .chn {
      padding: 9px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
    }

    #groups .chn .ico {
      width: 84px;
      height: 48px;
      object-fit: contain;
      background: transparent;
      flex: none;
      display: block;
    }

    #groups .chn .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-size: 15px;
    }

    #groups .chn.focus,
    .group-focus .chn:focus {
      background: #1d242c;
      border-left-color: var(--focus);
      outline: none;
    }

    #groups .chn.active {
      color: var(--accent);
    }

    /* 右：播放区 */
    #stage {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #videoWrap {
      position: relative;
      flex: 1;
      background: #000;
    }

    #artbox {
      position: absolute;
      inset: 0;
    }

    #err {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #ff8080;
      text-align: center;
      background: rgba(0, 0, 0, .6);
      z-index: 60;
    }

    #err.show {
      display: flex;
    }

    #bar {
      height: 56px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      background: var(--panel);
    }

    #nowTitle {
      font-size: 18px;
      font-weight: 600;
    }

    #epg {
      font-size: 13px;
      color: var(--dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    #epg .on {
      color: var(--accent);
    }

    #hint {
      color: var(--dim);
      font-size: 12px;
      margin-top: 6px;
    }

    #epglist {
      position: absolute;
      right: 12px;
      bottom: 64px;
      width: 42%;
      max-height: 52%;
      overflow: auto;
      background: rgba(18, 22, 26, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: none;
      z-index: 30;
      /* 需高于 Artplayer 内部 video 的 z-index:10，否则回看列表会被视频遮挡 */
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    }

    #epglist .ei {
      padding: 8px 12px;
      border-left: 3px solid transparent;
      font-size: 13px;
      cursor: pointer;
    }

    #epglist .ei .t {
      color: var(--dim);
      margin-right: 8px;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    #epglist .ei.on {
      color: var(--accent);
    }

    #epglist .ei.focus {
      background: #1d242c;
      border-left-color: var(--focus);
      outline: none;
    }

    @media (max-width:820px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        grid-template-areas: "stage" "side";
      }

      #side {
        grid-area: side;
      }

      #stage {
        grid-area: stage;
        min-height: 45vh;
      }

      #groups {
        max-height: 40vh;
      }
    }

    /* 频道列表隐藏模式：视频铺满整行（rows 必须保持 100vh，否则 stage 会塌缩） */
    body.hide-list #app {
      grid-template-columns: 1fr;
      grid-template-rows: 100vh;
      grid-template-areas: "stage";
    }

    body.hide-list #side {
      display: none;
    }

    /* 列表隐藏时的悬浮入口，避免找不到频道列表 */
    #listbtn {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 70;
      cursor: pointer;
      background: rgba(18, 22, 26, .85);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      display: none;
      user-select: none;
    }

    body.hide-list #listbtn {
      display: block;
    }

    /* 全屏 */
    #videoWrap:fullscreen {
      width: 100vw;
      height: 100vh;
    }

    #videoWrap:fullscreen::backdrop {
      background: #000;
    }

    #fsbtn {
      cursor: pointer;
      color: var(--dim);
      font-size: 18px;
      user-select: none;
      padding: 2px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      flex: none;
    }

    #fsbtn:hover {
      color: var(--text);
      border-color: var(--dim);
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="side">
      <div id="head">📺 电视直播 <b id="count"></b></div>
      <div id="groups"></div>
    </div>
    <div id="stage">
      <div id="videoWrap">
        <div id="artbox"></div>
        <div id="err">
          <div>播放失败<br><span id="errmsg"></span></div>
        </div>
        <div id="listbtn">☰ 频道</div>
      </div>
      <div id="bar">
        <div id="nowTitle"></div>
        <div id="epg"></div>
        <div id="hint">↑↓ 换台 OK 列表 → EPG ← 收起 · 双击/F 全屏</div>
        <div id="fsbtn" title="全屏">⛶</div>
      </div>
      <div id="epglist"></div>
    </div>
  </div>

  <script src="./hls.min.js"></script>
  <script src="./mpegts.js"></script>
  <script src="./artplayer.js"></script>
  <script>
    (function () {
      'use strict';
      var list = [];          // 展平频道（含 group）
      var groups = [];        // [{name, channels:[]}]
      var idx = -1;           // 当前频道的展平下标
      var expanded = {};      // 分组 gi -> 是否展开（下拉）
      var focus = { gi: 0, ci: -1 }; // 当前焦点：gi=分组，ci=-1 表示选中分组头
      var art = null;         // Artplayer 实例
      var engine = null;      // 底层引擎实例（hls / mpegts）
      var video = null;       // art.video 快捷引用（遥控/音量等用）
      var errBox, errMsg, nowTitle, epgBox;
      errBox = document.getElementById('err'); errMsg = document.getElementById('errmsg');
      nowTitle = document.getElementById('nowTitle'); epgBox = document.getElementById('epg');
      var ORIGIN = location.origin;

      function qs(k) { return new URLSearchParams(location.search).get(k); }
      function tokenStr() { var t = qs('my_token'); return t ? 'my_token=' + encodeURIComponent(t) : ''; }
      function mk(url) { if (!tokenStr()) return url; return url + (url.indexOf('?') >= 0 ? '&' : '?') + tokenStr(); }

      function loadChannels() {
        fetch(mk(ORIGIN + '/api/player/channels')).then(function (r) { return r.json(); }).then(function (d) {
          if (!d.channels || !d.channels.length) { errMsg.textContent = '无频道（未配置订阅或订阅为空）'; errBox.classList.add('show'); return; }
          list = d.channels;
          groups = groupBy(list);
          renderGroups();
          document.getElementById('count').textContent = list.length + ' 台';
          // 默认全部分组收起，仅聚焦第一个分组头（用户点开/OK 才下拉）
          focus = { gi: groups.length ? 0 : -1, ci: -1 };
          if (groups.length) playIndex(0);
          renderGroups();
        }).catch(function (e) { errMsg.textContent = '加载频道失败:' + e; errBox.classList.add('show'); });
      }

      function groupBy(arr) {
        var m = {};
        arr.forEach(function (c) { (m[c.group || '默认'] = m[c.group || '默认'] || []).push(c); });
        return Object.keys(m).map(function (n) { return { name: n, channels: m[n] }; });
      }

      function renderGroups() {
        var el = document.getElementById('groups'); el.innerHTML = '';
        groups.forEach(function (g, gi) {
          var h = document.createElement('div'); h.className = 'grp'; h.dataset.gi = gi;
          h.innerHTML = '<span class="caret">' + (expanded[gi] ? '▾' : '▸') + '</span> <span class="gn">' + escapeHtml(g.name) + '</span> <span class="gc">(' + g.channels.length + ')</span>';
          h.addEventListener('click', function () { focus = { gi: gi, ci: -1 }; toggleGroup(gi); });
          el.appendChild(h);
          if (expanded[gi]) {
            g.channels.forEach(function (c, ci) {
              var ch = document.createElement('div'); ch.className = 'chn'; ch.dataset.gi = gi; ch.dataset.ci = ci;
              ch.innerHTML = (c.tvg_logo ? '<img class="ico" src="' + c.tvg_logo + '" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '<div class="ico"></div>') + '<span class="nm">' + escapeHtml(c.name) + '</span>';
              ch.addEventListener('click', function () { playBy(gi, ci); });
              el.appendChild(ch);
            });
          }
        });
        applyFocus();
      }

      function flatIndexOf(gi, ci) { var s = 0, i; for (i = 0; i < gi; i++) s += groups[i].channels.length; return s + ci; }

      // 可见可选节点：分组头 + 已展开分组内的频道
      function visibleNodes() {
        var arr = [];
        groups.forEach(function (g, gi) {
          arr.push({ gi: gi, ci: -1 });
          if (expanded[gi]) g.channels.forEach(function (c, ci) { arr.push({ gi: gi, ci: ci }); });
        });
        return arr;
      }

      // 增量展开/收起：只插入或删除当前分组的频道行，不重建整棵列表，
      // 因此不会把滚动位置/焦点冲掉（避免展开一个分组后列表跳回顶部）。
      function toggleGroup(gi) {
        expanded[gi] = !expanded[gi];
        if (!expanded[gi] && focus.gi === gi) focus = { gi: gi, ci: -1 }; // 收起时焦点回到分组头
        var el = document.getElementById('groups');
        var h = el.querySelector('.grp[data-gi="' + gi + '"]');
        if (h) {
          var caret = h.querySelector('.caret');
          if (expanded[gi]) {
            var frag = document.createDocumentFragment();
            groups[gi].channels.forEach(function (c, ci) {
              var ch = document.createElement('div'); ch.className = 'chn'; ch.dataset.gi = gi; ch.dataset.ci = ci;
              ch.innerHTML = (c.tvg_logo ? '<img class="ico" src="' + c.tvg_logo + '" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '<div class="ico"></div>') + '<span class="nm">' + escapeHtml(c.name) + '</span>';
              ch.addEventListener('click', function () { playBy(gi, ci); });
              frag.appendChild(ch);
            });
            if (h.nextSibling) el.insertBefore(frag, h.nextSibling);
            else el.appendChild(frag);
          } else {
            el.querySelectorAll('.chn[data-gi="' + gi + '"]').forEach(function (n) { n.remove(); });
          }
          if (caret) caret.textContent = expanded[gi] ? '▾' : '▸';
        }
        applyFocus(true); // 仅高亮，不 scrollIntoView，保持当前滚动位置
      }

      function playBy(gi, ci) {
        focus = { gi: gi, ci: ci };
        expanded[gi] = true;
        playIndex(flatIndexOf(gi, ci));
        renderGroups();
      }

      function moveFocus(dir) {
        var nodes = visibleNodes(); if (!nodes.length) return;
        var pos = -1, i;
        for (i = 0; i < nodes.length; i++) if (nodes[i].gi === focus.gi && nodes[i].ci === focus.ci) { pos = i; break; }
        if (pos < 0) pos = 0;
        var next = nodes[(pos + dir + nodes.length) % nodes.length];
        focus = { gi: next.gi, ci: next.ci };
        if (next.ci >= 0) playIndex(flatIndexOf(next.gi, next.ci));
        renderGroups();
      }

      function applyFocus(noScroll) {
        var n = document.querySelectorAll('#groups .chn');
        n.forEach(function (x) { x.classList.remove('focus', 'active'); });
        document.querySelectorAll('#groups .grp').forEach(function (h) { h.classList.remove('focus'); });
        if (focus.gi < 0) return;
        if (focus.ci < 0) {
          var gh = document.querySelectorAll('#groups .grp')[focus.gi];
          if (gh) { gh.classList.add('focus'); if (!noScroll) gh.scrollIntoView({ block: 'nearest' }); }
        } else {
          n.forEach(function (x) {
            if (x.dataset.gi == focus.gi && x.dataset.ci == focus.ci) { x.classList.add('focus', 'active'); if (!noScroll) x.scrollIntoView({ block: 'nearest' }); }
          });
        }
      }

      // 按服务端 /player/<key> 实际返回的 Content-Type 判定播放引擎：
      // 服务端对 m3u8 回 application/vnd.apple.mpegurl，对 TS/FLV 连流回 video/mp2t、video/x-flv。
      // 不能只凭 scheme 猜——广东联通等 RTSP-over-HTTPS 源回 video/mp2t 却会被误当 m3u8 播不了。
      // 优化：Content-Type 明确时直接返回，不读 body（避免探测请求消耗直播 m3u8 内容）；
      // 仅 CT 不明确时才读前 512 字节嗅探（#EXTM3U / TS 0x47），随即取消。
      function detectType(url) {
        var ctrl = new AbortController();
        return fetch(url, { signal: ctrl.signal }).then(function (r) {
          var cls = (r.headers.get('content-type') || '').toLowerCase();
          // Content-Type 明确：直接返回，不读 body
          if (cls.indexOf('mpegurl') >= 0 || cls.indexOf('m3u8') >= 0) { ctrl.abort(); return 'm3u8'; }
          if (cls.indexOf('mp2t') >= 0 || cls.indexOf('mpegts') >= 0) { ctrl.abort(); return 'mpegts'; }
          if (cls.indexOf('flv') >= 0) { ctrl.abort(); return 'mpegts'; }
          if (cls.indexOf('mp4') >= 0) { ctrl.abort(); return 'native'; }
          // CT 不明确：读前 512 字节嗅探
          var rd = null;
          try { if (r.body && r.body.getReader) rd = r.body.getReader(); } catch (e) { }
          var chunkStr = function (a) {
            var s = '', i;
            for (i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192));
            return s;
          };
          function sniff() {
            if (!rd) return Promise.resolve('');
            var buf = '';
            function step() {
              return rd.read().then(function (res) {
                if (res.done) return decide(buf);
                buf += chunkStr(new Uint8Array(res.value));
                if (buf.length >= 512) return decide(buf);
                return step();
              }, function () { return decide(buf); });
            }
            function decide(s) {
              var u = s.toUpperCase();
              if (u.indexOf('#EXTM3U') === 0) return 'm3u8';
              if ((s.charCodeAt(0) || 0) === 0x47) return 'mpegts'; // TS sync 0x47
              return '';
            }
            return step();
          }
          return sniff().then(function (s) {
            try { if (rd && rd.cancel) rd.cancel(); } catch (e) { }
            try { ctrl.abort(); } catch (e) { }
            return s || 'm3u8'; // CT 不明确时交给嗅探结果，再兜底 m3u8
          });
        }, function () { return 'm3u8'; });
      }

      function playIndex(i) {
        idx = i; var c = list[i];
        curKey = c.key; epgMode = false; // 换台退出 EPG 列表
        nowTitle.textContent = c.name;
        setEpg(c);
        errBox.classList.remove('show');
        var u = mk(ORIGIN + '/player/' + c.key);
        // scheme 决定引擎：udp/rtp/rtsp→服务端恒定出 video/mp2t（mpegts.js）；
        // http(s)→按服务端 Content-Type 判定（m3u8 / TS(FLV) / mp4），TS 连流走 mpegts.js 而非 hls.js。
        if (c.scheme === 'http' || c.scheme === 'https') {
          detectType(u).then(function (type) {
            if (idx !== i || curKey !== list[i].key) return; // 已切台则丢弃过期探测结果
            artCreate(u, type, true);
          });
        } else {
          artCreate(u, 'mpegts', true);
        }
      }

      // Artplayer 播放（直播 isLive=true 隐藏进度条；回看 VOD 式窗口可拖动）
      var createSeq = 0;   // 播放器实例序号：切台后用于丢弃旧引擎的迟到错误回调
      var autoMuted = false; // 当前静音是否由“自动播放被拦”兜底造成（用于点屏幕自动恢复声音）
      var userActive = false; // 用户是否在页面上有过任意按键/点击（有交互即允许恢复声音）
      function markUserActive() { userActive = true; }
      document.addEventListener('pointerdown', markUserActive, true);
      document.addEventListener('keydown', markUserActive, true);
      function artCreate(url, type, isLive) {
        stopCurrent();
        var mySeq = ++createSeq;
        // 当前实例错误（切台瞬间旧引擎的迟到回调直接忽略，避免误弹“播放失败”）
        function onInstErr(a, b) { if (mySeq === createSeq) onErr(a, b); }
        art = new Artplayer({
          container: '#artbox',
          url: url,
          type: type,
          isLive: !!isLive,
          autoplay: true,          // 每次都是全新实例，默认有声起播
          theme: '#2b80ff',
          keyboard: false,          // 方向键留给频道导航，避免冲突
          setting: false,
          playbackRate: !isLive,
          aspectRatio: false,
          flip: false,
          screenshot: false,
          pip: false,
          mutex: false,
          miniProgressBar: !isLive,
          moreVideoAttr: { playsInline: true, 'webkit-playsinline': true, 'x5-playsinline': true },
          customType: {
            m3u8: function (v, u) {
              if (window.Hls && Hls.isSupported()) {
                var hls = new Hls({
                  lowLatencyMode: false,
                  // 90s：Chrome/Edge 后台标签定时器节流到 1 次/分钟，缓冲须能撑过 60s 空档
                  // （上游 live 窗口 10×10s=100s，90s 可拉满），否则后台必然断流
                  maxBufferLength: 90,
                  backBufferLength: 30,      // 裁剪已播缓冲，长时播放降低内存压力
                  liveSyncDurationCount: 3,  // 直播追赶点：落后边缘 3 个分片起播/续播
                  liveMaxLatencyDurationCount: 8, // 超过 8 片延迟自动追赶
                  startFragPrefetch: true,   // manifest 解析中预取首个分片，加快起播
                  maxBufferHole: 0.5,        // 允许跳过的缓冲洞（s）
                  nudgeMaxRetry: 10,         // 卡顿微调（currentTime nudge）重试上限，默认 3 偏少
                  fragLoadingMaxRetry: 6,    // 分片加载重试次数，默认 6
                  manifestLoadingMaxRetry: 3, // 清单加载重试次数
                  levelLoadingMaxRetry: 4    // 级别清单加载重试
                });
                var retries = 0;
                var fallBackMpegts = false; // 是否已降级到 mpegts.js
                hls.loadSource(u);
                hls.attachMedia(v);
                // hls.js 签名 (event, data)：details/fatal 都在 data 里，必须取第 2 参。
                // 致命错误先自动恢复（上游偶发脏清单 manifestParsingError/网络抖动很常见），
                // 重试 3 次仍失败才弹"播放失败"，避免用户看到一闪而过的报错。
                hls.on(Hls.Events.ERROR, function (ev, data) {
                  if (mySeq !== createSeq) return;
                  if (data && data.fatal && retries < 3) {
                    retries++;
                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); return; } catch (e) { } }
                    try { hls.startLoad(); return; }
                    catch (e) { }
                  }
                  onInstErr(data);
                });
                // 降级检测：hls.js 加载 m3u8 + 分片后，如果 8 秒内 video 的 readyState
                // 一直未提升到 2（HAVE_CURRENT_DATA），说明 MSE 无法解码该流（如 mp2 音频），
                // 自动降级到 mpegts.js（直接 TS remux，不依赖 MSE codec 支持）。
                var stallCheck = 0;
                var stallTimer = setInterval(function () {
                  if (mySeq !== createSeq || fallBackMpegts) { clearInterval(stallTimer); return; }
                  stallCheck++;
                  if (v.readyState >= 2) { clearInterval(stallTimer); return; } // 已就绪，正常
                  if (stallCheck >= 5) { // 5 秒后仍未就绪，降级
                    clearInterval(stallTimer);
                    fallBackMpegts = true;
                    console.warn('[player] hls.js 加载 8s 未就绪 (readyState=' + v.readyState + ')，降级到 mpegts.js');
                    try { hls.destroy(); } catch (e) { }
                    engine = null;
                    // 用 mpegts.js 重新加载（mpegts.js 用 MSE 直传 video/mp2t 容器，
                    // 不做 TS→fMP4 转封装，所以 mp2 等非 AAC 音频也能播）
                    if (window.mpegts && mpegts.isSupported && mpegts.isSupported()) {
                      var inst = mpegts.createPlayer({ type: 'm3u8', isLive: true, url: u, enableStashBuffer: true, stashInitialSize: 256 * 1024 });
                      inst.attachMediaElement(v);
                      inst.load();
                      inst.on(mpegts.Events.ERROR, function (et, detail) { onInstErr(et, detail); });
                      engine = inst;
                      try { v.play(); } catch (e) { }
                    } else {
                      v.src = u; // 原生兜底
                    }
                  }
                }, 1000);
                engine = hls;
              } else {
                v.src = u; // Safari 原生 HLS
              }
            },
            mpegts: function (v, u) {
              if (window.mpegts && mpegts.isSupported && mpegts.isSupported()) {
                var inst = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: u, enableStashBuffer: true, stashInitialSize: 256 * 1024 });
                inst.attachMediaElement(v);
                inst.load();
                // mpegts.js 签名 (errorType, detail)：两个参数都要接住
                inst.on(mpegts.Events.ERROR, function (et, detail) { onInstErr(et, detail); });
                engine = inst;
              } else {
                v.src = u; // 原生兜底（多数浏览器不支持 TS）
              }
            },
            native: function (v, u) { v.src = u; } // 原生 <video> 播 mp4
          }
        });
        video = art.video; // 遥控 OK 播放/暂停用
        // 用户手动碰音量后，不再是“被拦静音”状态
        art.on('video:volumechange', function () { autoMuted = false; });
        // 起播成功即清除错误浮层（避免一次瞬时错误后“播放失败”常驻）
        art.on('video:playing', function () {
          if (mySeq !== createSeq) return;
          errBox.classList.remove('show');
          // 双保险：切台必然伴随用户按键/点击，一旦有过交互就强制恢复声音，
          // 覆盖浏览器各种自动播放静音策略（电脑/手机一致）。
          if (userActive && video && video.muted) {
            try { video.muted = false; autoMuted = false; } catch (e) { }
          }
        });
        // 起播兜底（关键）：Chrome/Edge 的自动播放策略在媒体就绪（canplay）后拦截“有声 play()”
        // 抛 NotAllowedError。注意兜底必须挂在 canplay —— 创建实例时 hls/mpegts 尚未挂载媒体源，
        // 此时 play() 只会抛 NotSupportedError，时机不对的兜底永远不会生效（表现为一直黑屏不播）。
        art.on('video:canplay', function () {
          if (mySeq !== createSeq || !video || !video.paused) return;
          var p = video.play();
          if (p && p.catch) p.catch(function (err) {
            if (!err || err.name !== 'NotAllowedError') return; // 非策略拦截，保持有声
            try {
              video.muted = true; autoMuted = true;
              var p2 = video.play(); if (p2 && p2.catch) p2.catch(function () { });
              // 让用户知道为什么没声音：浏览器拦了有声自动播放
              if (art && art.notice) try { art.notice.show = '浏览器拦截了自动播放：已静音起播，点音量图标恢复声音'; } catch (e3) { }
            } catch (e2) { }
          });
        });
        // video 元素级错误（MediaError）：转成可读文本，避免“未知错误”
        art.on('video:error', function () {
          if (mySeq !== createSeq) return;
          var v = video && video.error;
          var codes = { 1: '取流中断', 2: '网络错误', 3: '解码错误', 4: '格式/编码不支持' };
          onErr({ message: v ? (codes[v.code] || ('错误码 ' + v.code)) : '视频错误' });
        });
        return art;
      }

      function onErr(e, d2) {
        // hls.js 正确传法是 onErr(data)；mpegts.js 是 (errorType, detail) 两个参数——
        // 之前直接把 onErr 挂上去导致 details/fatal 全丢，任何错误都显示“未知错误”。
        if (typeof e === 'string') { e = { message: e + (d2 ? ' ' + d2 : '') }; }
        // 诊断：所有引擎错误都打到控制台（非致命 warn / 致命 error），便于用户 F12 排查
        if (e && e.fatal === false) { console.warn('[hls] 非致命(自动恢复):', e.details || e.message || e); return; }
        console.error('[player] 致命错误:', (e && (e.details || e.message)) || e);
        errMsg.textContent = (e && (e.details || e.message)) ? (e.details || e.message) : '未知错误';
        errBox.classList.add('show');
      }

      function stopCurrent() {
        // 旧引擎彻底丢弃：先解绑媒体元素再销毁，不留任何旧实例/旧回调源
        if (engine) {
          try { if (engine.detachMedia) engine.detachMedia(); } catch (e) { }                    // hls.js
          try { if (engine.detachMediaElement) engine.detachMediaElement(); } catch (e) { }     // mpegts.js
          try { if (engine.unload) engine.unload(); } catch (e) { }                              // mpegts.js 停止拉流
          try { if (engine.destroy) engine.destroy(); } catch (e) { }
          engine = null;
        }
        if (art) { try { art.destroy(false); } catch (e) { } art = null; } // false=保留容器 DOM，便于重建
        video = null;
        errBox.classList.remove('show');
      }

      // EPG
      var epgProgs = [];   // 当前频道今日节目
      var epgMode = false; // EPG 列表导航态
      var epgFocus = -1;
      var curKey = '';     // 当前频道 key

      // 注意：必须用 pad2 补齐月/日，不能做 ''+year*10000 的字符串拼接（会把 900+1 拼成 "9001" 而非 "0901"）
      function todayYmd() { var d = new Date(); return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function nowYmdHis() { var d = new Date(); return todayYmd() + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()); }
      // 任意 EPG 时间 → YYYYMMDDHHMMSS：兼容 XMLTV("20260901112900 +0800")/纯数字/ISO("2026-09-01 11:29:00"、"2026-09-01T11:29:00")/HH:MM
      function toYmdHis(s) {
        s = (s || '').trim(); if (!s) return '';
        if (s.length === 5 && s.indexOf(':') >= 0) { var p = s.split(':'); return todayYmd() + pad2(+p[0]) + pad2(+p[1]) + '00'; }
        var d = s.replace(/\D/g, ''); // 去掉所有非数字（含 - / : . + T 时区后缀）
        if (d.length >= 14) return d.slice(0, 14);
        if (d.length === 12) return d + '00'; // 只有年月日时分
        return '';
      }
      function isPast(p) { var st = toYmdHis(p.start); return !!st && st < nowYmdHis(); }

      function setEpg(c) {
        epgBox.textContent = ''; epgProgs = []; renderEPGList();
        var q = 'date=' + todayYmd() + '&ch=' + encodeURIComponent(c.tvg_id || '') + '&name=' + encodeURIComponent(c.name);
        fetch(mk(ORIGIN + '/api/player/epg?' + q)).then(function (r) { return r.json(); }).then(function (j) {
          epgProgs = (j && j.programs) || [];
          if (epgProgs.length) { epgBox.innerHTML = '<span class="on">' + escapeHtml(epgProgs[epgProgs.length - 1].title) + '</span> · ' + escapeHtml(epgProgs[0].title) + ' …'; }
          renderEPGList();
        }).catch(function () { renderEPGList(); });
      }

      function renderEPGList() {
        var el = document.getElementById('epglist');
        // 默认隐藏，仅 EPG 模式（用户 → 打开）才显示，避免常驻遮挡画面
        if (!curKey || epgProgs.length === 0 || !epgMode) { el.style.display = 'none'; return; }
        el.innerHTML = '';
        epgProgs.forEach(function (p, i) {
          var it = document.createElement('div'); it.className = 'ei' + (isPast(p) ? ' past' : ''); it.dataset.i = i;
          it.innerHTML = '<span class="t">' + escapeHtml(p.start) + '-' + escapeHtml(p.stop || p.end || '') + '</span> ' + escapeHtml(p.title);
          it.addEventListener('click', function () { if (isPast(p)) startCatchup(p); });
          el.appendChild(it);
        });
        el.style.display = 'block';
      }

      function paintEPGFocus() {
        var el = document.getElementById('epglist');
        var rows = el.querySelectorAll('.ei');
        rows.forEach(function (x, i) { x.classList.toggle('focus', i === epgFocus); });
        if (epgProgs[epgFocus] && rows[epgFocus]) rows[epgFocus].scrollIntoView({ block: 'nearest' });
      }

      // 基于 EPG 回看：服务端拼 playseek 生成受控短地址播放
      function startCatchup(p) {
        var start = toYmdHis(p.start), end = toYmdHis(p.stop || p.end || '');
        if (!start) { showGoes('无法取到该节目时间'); return; }
        epgMode = false; epgFocus = -1; renderEPGList(); // 退出 EPG 列表，避免其遮挡回看画面
        fetch(mk(ORIGIN + '/api/player/catchup?key=' + encodeURIComponent(curKey) + '&start=' + start + '&end=' + end))
          .then(function (r) { return r.json(); }).then(function (d) { if (d.url) playURL(d.url, '回看'); })
          .catch(function (e) { onErr(e); });
      }

      function showGoes(msg) { errMsg.textContent = msg; errBox.classList.add('show'); }

      // 通用播放（直播/回看），按给定受控 URL
      function playURL(u, tag) {
        nowTitle.innerHTML = (tag ? tag + ' · ' : '') + escapeHtml((list[idx] ? list[idx].name : ''));
        errBox.classList.remove('show');
        artCreate(mk(u), 'm3u8', false); // 回看窗口可拖动进度
      }

      function escapeHtml(s) { return (s || '').replace(/[<>&"]/g, function (ch) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[ch]; }); }

      // 手机端静音解锁：自动播放被拦导致静音起播后，任意点击/触摸屏幕即恢复声音
      // （用户手势内调 play+unmute，iOS/Android 均认可）；仅针对“被拦静音”，不覆盖用户主动静音。
      document.addEventListener('pointerdown', function () {
        if (autoMuted && video && video.muted) {
          try {
            video.muted = false;
            var p = video.play();
            if (p && p.catch) p.catch(function () { try { video.muted = true; } catch (e) { } });
            else autoMuted = false;
          } catch (e) { }
        }
      }, true);

      // ============ 频道列表 显示/隐藏 ============
      // 鼠标：单击视频区域切换列表；遥控：OK 键呼出（隐藏时），← 在分组头收起后继续按可隐藏
      var listHidden = false;
      function setListHidden(h) {
        listHidden = h;
        document.body.classList.toggle('hide-list', h);
        if (!h) applyFocus(); // 重新显示时高亮并滚动到当前频道
      }

      // ============ 全屏 ============
      // 入口：底栏 ⛶ 按钮 / 双击视频 / F 键；再按或 Esc 退出。
      // 手机端：进入全屏后锁定横屏（Android 支持 screen.orientation.lock；
      // iOS 走系统播放器 webkitEnterFullscreen 自动随视频转横屏），退出时解锁。
      function lockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            var p = screen.orientation.lock('landscape');
            if (p && p.catch) p.catch(function () { }); // 不支持/被拒则忽略，保持竖屏全屏
          }
        } catch (e) { }
      }
      function unlockOrientation() {
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { }
      }
      function toggleFS() {
        var el = document.getElementById('videoWrap');
        if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); return; }
        if (el.requestFullscreen) {
          var p = el.requestFullscreen();
          if (p && p.then) p.then(lockLandscape).catch(function () { });
          else lockLandscape();
        }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); lockLandscape(); }
        else if (video && video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari：系统全屏自动横屏
      }
      var fsbtn = document.getElementById('fsbtn');
      fsbtn.addEventListener('click', toggleFS);
      document.addEventListener('fullscreenchange', function () {
        fsbtn.textContent = document.fullscreenElement ? '⛶' : '⛶'; // 图标不变，留接口
        fsbtn.style.color = document.fullscreenElement ? 'var(--accent)' : '';
        if (!document.fullscreenElement) unlockOrientation(); // 退出全屏恢复系统自动旋转
      });

      // 视频区域：单击=收起/呼出频道列表，双击=全屏（260ms 区分单击与双击）
      var videoWrap = document.getElementById('videoWrap');
      var clickTimer = null;
      videoWrap.addEventListener('click', function () {
        if (clickTimer) return;
        clickTimer = setTimeout(function () { clickTimer = null; setListHidden(!listHidden); }, 260);
      });
      videoWrap.addEventListener('dblclick', function () {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        toggleFS();
      });
      // 悬浮「☰ 频道」按钮：列表隐藏时点击呼出（阻止冒泡，避免触发视频区的再次收起）
      document.getElementById('listbtn').addEventListener('click', function (ev) {
        ev.stopPropagation();
        setListHidden(false);
      });

      // 遥控
      document.addEventListener('keydown', function (ev) {
        if (epgMode && epgProgs.length) {
          switch (ev.key) {
            case 'ArrowDown': epgFocus = (epgFocus + 1) % epgProgs.length; paintEPGFocus(); ev.preventDefault(); return;
            case 'ArrowUp': epgFocus = (epgFocus - 1 + epgProgs.length) % epgProgs.length; paintEPGFocus(); ev.preventDefault(); return;
            case 'ArrowLeft': epgMode = false; renderEPGList(); ev.preventDefault(); return;
          }
        }
        switch (ev.key) {
          case 'ArrowDown': moveFocus(1); ev.preventDefault(); break;
          case 'ArrowUp': moveFocus(-1); ev.preventDefault(); break;
          case 'ArrowRight':
            if (focus.gi >= 0 && focus.ci >= 0) { epgMode = true; epgFocus = 0; renderEPGList(); paintEPGFocus(); } // 进入该频道 EPG 回看
            else if (focus.gi >= 0 && focus.ci < 0 && !expanded[focus.gi]) { expanded[focus.gi] = true; focus.ci = 0; playIndex(flatIndexOf(focus.gi, 0)); renderGroups(); }
            ev.preventDefault(); break;
          case 'ArrowLeft':
            if (focus.gi >= 0 && focus.ci >= 0) { focus.ci = -1; renderGroups(); }
            else if (focus.gi >= 0 && focus.ci < 0 && expanded[focus.gi]) { toggleGroup(focus.gi); }
            else if (focus.gi >= 0 && focus.ci < 0) { setListHidden(true); } // 已在最上级：收起频道列表
            ev.preventDefault(); break;
          case 'f': case 'F': toggleFS(); ev.preventDefault(); break; // 全屏
          case ' ': toggle(); ev.preventDefault(); break;             // 空格 播放/暂停
        }
      });
      document.addEventListener('keyup', function (ev) {
        if (ev.key === 'Enter' || ev.key === 'OK') {
          if (listHidden) { setListHidden(false); ev.preventDefault(); return; } // OK 呼出频道列表
          if (epgMode && epgProgs[epgFocus]) { var p = epgProgs[epgFocus]; if (isPast(p)) { startCatchup(p); } else { epgMode = false; renderEPGList(); } ev.preventDefault(); return; }
          if (focus.gi >= 0 && focus.ci < 0) toggleGroup(focus.gi); // 分组头：展开/收起
          else toggle();                                        // 频道：播放/暂停
          ev.preventDefault();
        }
        if (ev.key === 'Backspace' || ev.key === 'Escape' || ev.keyCode === 108) {
          if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); ev.preventDefault(); return; } // 全屏时返回键先退全屏
          history.back();
        }
      });
      document.addEventListener('keyup', function (ev) {
        if (ev.key === 'MediaPlayPause' || ev.key === 'MediaPlay' || ev.key === 'MediaPause') { toggle(); }
      });
      function toggle() {
        if (!video) return;
        if (video.paused) { try { video.play().catch(function () { }); } catch (e) { } }
        else { try { video.pause(); } catch (e) { } }
      }

      // 后台返回自动恢复：Chrome/Edge 对后台标签页定时器节流（最长 1 次/分钟），
      // 缓冲耗尽会卡住；回前台时主动续载+续播（90s 缓冲已在后台尽量撑住，这里是兜底）。
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible' || !video) return;
        if (video.paused && !video.ended) { try { var p = video.play(); if (p && p.catch) p.catch(function () { }); } catch (e) { } }
        if (video.readyState < 3 && engine) {
          if (typeof engine.startLoad === 'function') { try { engine.startLoad(); } catch (e) { } }
          else if (typeof engine.load === 'function') { try { engine.load(); } catch (e) { } } // mpegts.js
        }
      });

      loadChannels();
    })();
  </script>
</body>
