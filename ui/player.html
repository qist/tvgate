<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Player</title>
    <script>
      // 首帧前引导：只做三件事——判定平台档位、提前落外观/主题类，避免首屏闪色与首帧卡顿。
      // 数据契约：<html> 上的 data-player-platform（lib/platform.ts 消费）、
      // data-performance-tier（index.css 的低性能档选择器消费）、player-theme-*/dark 类。
      (() => {
        const root = document.documentElement;
        const ua = navigator.userAgent;

        const webOS = /(?:Web0S|webOS)/i.test(ua) || (/\bNetCast\b/i.test(ua) && /\b(?:SmartTV|Colt)\/[\d.]+/i.test(ua));
        const android = /Android|HarmonyOS|OpenHarmony/i.test(ua);
        const androidTV = android && /\b(?:TV|SmartTV|GoogleTV|BRAVIA|SHIELD|MiTV|MIBOX)\b|\bAFT[A-Z0-9]+\b/i.test(ua);
        const iDevice =
          /iPhone|iPad|iPod|CPU (?:iPhone )?OS \d+[_\d]* like Mac OS X|EdgiOS|CriOS|FxiOS|OPiOS/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const handheld = /Mobile|Tablet|Silk|Kindle|PlayBook/i.test(ua);

        const platform = webOS ? "lg-webos" : androidTV ? "android-tv" : android ? "android" : iDevice ? "ios" : handheld ? "mobile" : "desktop";
        root.dataset.playerPlatform = platform;

        const finite = (value) => (Number.isFinite(value) ? value : undefined);
        const memory = finite(navigator.deviceMemory);
        const cores = finite(navigator.hardwareConcurrency);
        const weakAndroid = android && ((memory !== undefined && memory <= 4) || (cores !== undefined && cores <= 4));
        root.dataset.performanceTier = webOS || androidTV || weakAndroid ? "constrained" : "capable";

        const inStandalone =
          typeof navigator.standalone === "boolean"
            ? navigator.standalone
            : window.matchMedia("(display-mode: standalone)").matches;
        root.classList.toggle("player-standalone", inStandalone);

        // 外观：与 lib/appearance.ts、use-appearance.ts 共用同一存储键与类名契约，
        // 默认 emerald（APPLICATION_APPEARANCES 首项不一致会闪一帧别的配色）。
        const APPEARANCES = ["ocean", "emerald", "sunset", "rose", "amber", "slate"];
        let appearance = "emerald";
        try {
          const saved = localStorage.getItem("tvgate-player-appearance");
          if (APPEARANCES.includes(saved)) appearance = saved;
        } catch (error) {
          console.warn("early appearance bootstrap failed", error);
        }
        for (const name of APPEARANCES) {
          root.classList.toggle(`player-theme-${name}`, name === appearance);
        }

        // 主题：auto 跟随系统；light/dark 为强制。存储键与 useTheme 的调用点保持一致。
        try {
          const saved = localStorage.getItem("tvgate-player-theme");
          const mode = saved === "light" || saved === "dark" ? saved : "auto";
          const dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          console.warn("early theme bootstrap failed", error);
        }
      })();
    </script>
    <script>
      // 启动错误上屏：iOS 15 等无 devtools 设备白屏时，把首帧前的 JS 错误直接画在页面上，
      // 截图即可回报；root 6s 仍未渲染时也给出提示（脚本未执行/资源被拦截/网络未通）。
      (function () {
        var shown = 0;
        function show(msg) {
          shown++;
          try {
            var el = document.createElement("div");
            el.setAttribute(
              "style",
              "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#7f1d1d;color:#fff;" +
                "font:11px/1.5 monospace;padding:8px 10px;word-break:break-all;max-height:50vh;overflow:auto;white-space:pre-wrap;",
            );
            el.textContent = "[启动错误] " + msg;
            (document.body || document.documentElement).appendChild(el);
          } catch (e) {
            /* ignore */
          }
        }
        window.addEventListener(
          "error",
          function (e) {
            // 带 target 的资源加载错误（script/link 加载失败）没有 message，由下方兜底提示覆盖
            if (e && e.target && e.target.tagName && !e.message) return;
            var m = e && e.message ? e.message + " @" + (e.filename || "") + ":" + (e.lineno || 0) : String(e);
            show(m);
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && (e.reason || e.detail);
          show("Promise 拒绝: " + (r && r.stack ? String(r.stack).slice(0, 500) : String(r)));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0 && shown === 0) {
            show("页面 6s 未渲染且无 JS 错误：脚本可能未执行或资源未加载。UA=" + navigator.userAgent.slice(0, 140));
          }
        }, 6000);
      })();
    </script>
    <link href="/src/styles/index.css" rel="stylesheet" />
  </head>
  <body class="overflow-hidden bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/pages/player.tsx"></script>
  </body>
</html>
